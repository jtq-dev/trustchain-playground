apiVersion: apps/v1
kind: Deployment
metadata:
  name: trustchain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trustchain
  template:
    metadata:
      labels:
        app: trustchain
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: trustchain
          image: "{{ .Values.image.repository }}{{- if .Values.image.digest -}}@{{ .Values.image.digest }}{{- else -}}:{{ .Values.image.tag }}{{- end }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080

          env:
            - name: APP_VERSION
              value: {{ .Chart.AppVersion | quote }}

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10

          resources:
           {{ toYaml .Values.resources | nindent 12 }}

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
